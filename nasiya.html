<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHOPLY — Nasiya boshqaruvi</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f1;color:#20221c;font-family:Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e7df;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 8px 24px #00000008}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;background:#b7f34a}.secondary{background:#eef0e9}.danger{background:#ffe7e7;color:#a22}.muted{color:#777;font-size:13px}input,textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px;margin:7px 0 12px;font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.pill{display:inline-block;background:#eef3e6;padding:5px 9px;border-radius:20px;font-size:12px}.person{width:90px;height:90px;object-fit:cover;border-radius:12px;background:#eee}.hidden{display:none!important}#gate{max-width:400px;margin:12vh auto}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1}pre{white-space:pre-wrap;word-break:break-word}@media(max-width:600px){.wrap{padding:12px}}</style></head><body><main class="wrap"><section id="gate" class="card"><h1>SHOPLY · Nasiya</h1><p class="muted">Nasiya arizalarini ko‘rish uchun maxsus parolni kiriting. Email talab qilinmaydi.</p><label>Parol</label><input id="pass" type="password" autocomplete="current-password" placeholder="Nasiya paroli"><p id="err" class="muted"></p><button class="btn" id="enter">Kirish</button></section><section id="app" class="hidden"><div class="row"><div><h1>Nasiyaga ariza berganlar</h1><p class="muted">Arizani tekshiring. Tasdiqlash moliyalashtirish yoki shartnoma o‘rnini bosmaydi.</p></div><button class="btn secondary" id="refresh">Yangilash</button><button class="btn secondary" id="logout">Chiqish</button></div><div id="list" class="grid"></div></section><div id="smsModal" class="hidden" style="position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:15px"><div class="card" style="width:min(520px,100%)"><h2>SMS yuborish</h2><p class="muted" id="smsTarget"></p><label>SMS matni</label><textarea id="smsText" rows="5"></textarea><div class="row"><button class="btn" id="smsSend">SMS yuborish</button><button class="btn secondary" id="smsCancel">Bekor qilish</button></div><p class="muted" id="smsStatus"></p></div></div></main><script>
const $=id=>document.getElementById(id);let rows=[],smsId='';async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Xatolik');return d}async function enter(){try{await api('/api/admin/nasiya-login',{method:'POST',body:JSON.stringify({password:$('pass').value})});$('gate').classList.add('hidden');$('app').classList.remove('hidden');await load()}catch(e){$('err').textContent=e.message;$('pass').value=''}}async function load(){try{rows=await api('/api/admin/nasiya-requests');$('list').innerHTML=rows.length?rows.map(x=>`<article class="card"><div class="row"><div><h3>${esc(x.name)}</h3><span class="pill">${esc(x.status)}</span></div>${x.selfieDataUrl?`<img class="person" src="${x.selfieDataUrl}" alt="Mijoz rasmi">`:'<div class="person" style="display:grid;place-items:center">Rasm yo‘q</div>'}</div><p><b>Telefon:</b> ${esc(x.phone)}<br><b>Email:</b> ${esc(x.email)} ${x.emailVerified?'✓':''}<br><b>Manzil:</b> ${esc(x.address)}<br><b>Telegram:</b> ${esc(x.telegram?.firstName||'—')} ${x.telegram?.username?'(@'+esc(x.telegram.username)+')':''} · ID ${esc(x.telegram?.id||'—')}<br><b>Lokatsiya:</b> ${x.location?.lat?`<a target="_blank" rel="noopener" href="https://maps.google.com/?q=${x.location.lat},${x.location.lng}">Xaritada ochish</a>`:'Ko‘rsatilmagan'}<br><b>Mahsulot:</b> ${esc(x.productName)}<br><b>Narxi:</b> ${money(x.price)} · <b>Muddat:</b> ${x.weeks} hafta<br><b>Hisob:</b> ${money(x.weeklyEstimate)} / hafta</p><div class="row"><button class="btn" onclick="status('${x.id}','Tasdiqlandi')">Tasdiqlash</button><button class="btn danger" onclick="status('${x.id}','Rad etildi')">Rad etish</button><button class="btn secondary" onclick="sms('${x.id}')">SMS yuborish</button></div>${(x.schedule||[]).length?'<h4>To‘lov jadvali</h4>'+x.schedule.map(d=>`<div>${new Date(d.dueAt).toLocaleDateString('uz-UZ')} · ${money(d.amount)} · ${d.paid?'To‘langan':'Kutilmoqda'}</div>`).join(''):''}</article>`).join(''):'<div class="card">Hozircha arizalar yo‘q.</div>'}catch(e){$('list').innerHTML='<div class="card">'+esc(e.message)+'</div>'}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(v){return (Number(v)||0).toLocaleString('uz-UZ')+' so‘m'}async function status(id,s){try{await api('/api/admin/nasiya-requests/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status:s})});await load()}catch(e){alert(e.message)}}function sms(id){const x=rows.find(v=>v.id===id);smsId=id;$('smsTarget').textContent=`${x?.name||''} · ${x?.phone||''}`;$('smsText').value=`SHOPLY: Hurmatli ${x?.name||'mijoz'}, ${x?.productName||'mahsulot'} bo‘yicha to‘lov muddati yaqinlashmoqda. Iltimos, to‘lovni o‘z vaqtida amalga oshiring.`;$('smsStatus').textContent='';$('smsModal').classList.remove('hidden')}async function sendSms(){try{$('smsSend').disabled=true;await api('/api/admin/nasiya-sms/'+encodeURIComponent(smsId),{method:'POST',body:JSON.stringify({message:$('smsText').value})});$('smsStatus').textContent='SMS provayderga yuborildi. Yetkazilganini provayder kabinetidan tekshiring.'}catch(e){$('smsStatus').textContent=e.message}finally{$('smsSend').disabled=false}}$('enter').onclick=enter;$('pass').onkeydown=e=>{if(e.key==='Enter')enter()};$('refresh').onclick=load;$('smsSend').onclick=sendSms;$('smsCancel').onclick=()=>$('smsModal').classList.add('hidden');$('logout').onclick=async()=>{await api('/api/admin/nasiya-logout',{method:'POST'});location.reload()};
</script></body></html>
