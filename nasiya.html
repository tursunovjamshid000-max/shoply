<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHOPLY — Nasiya boshqaruvi</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f4ef;color:#20221c;font-family:Arial,sans-serif}.wrap{max-width:1500px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #e4e6df;border-radius:16px;padding:17px;box-shadow:0 5px 20px #00000008}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;background:#b7ef4a;color:#20221c}.btn:disabled{opacity:.5;cursor:wait}.secondary{background:#eef0e9}.danger{background:#ffe5e5;color:#a22}.muted{color:#777;font-size:13px}input,textarea,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px;margin:7px 0 12px;font:inherit}.hidden{display:none!important}#gate{max-width:410px;margin:12vh auto}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:16px}.top h1{margin:0 0 6px;font-size:25px}.layout{display:grid;grid-template-columns:minmax(330px, .9fr) minmax(440px,1.25fr);gap:16px;align-items:start}.list-panel{padding:14px}.list-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.list{display:grid;gap:9px;margin-top:12px;max-height:calc(100vh - 210px);overflow:auto}.app-row{display:flex;gap:11px;align-items:center;padding:12px;border:1px solid #e7e8e2;border-radius:13px;cursor:pointer}.app-row.active{border:2px solid #8dbb2f;background:#f8fbeF}.avatar{width:54px;height:54px;object-fit:cover;border-radius:10px;background:#eee;flex:none}.app-main{min-width:0;flex:1}.app-main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.app-main small{display:block;color:#777;margin-top:5px}.pill{font-size:11px;border-radius:30px;padding:5px 8px;background:#eef3e6;white-space:nowrap}.detail{min-height:550px}.detail-empty{display:grid;place-items:center;min-height:450px;color:#888;text-align:center}.detail-head{display:flex;gap:16px;align-items:center;border-bottom:1px solid #eee;padding-bottom:16px}.detail-photo{width:104px;height:104px;object-fit:cover;border-radius:14px;background:#eee}.detail-head h2{margin:0 0 8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px 0}.stat{padding:13px;border-radius:12px;background:#f5f6f1}.stat small{display:block;color:#777;font-size:11px;margin-bottom:6px}.stat b{font-size:15px;overflow-wrap:anywhere}.section{border-top:1px solid #eee;padding-top:14px;margin-top:14px}.section h3{font-size:15px;margin:0 0 12px}.info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.info{padding:10px;background:#f8f9f6;border-radius:10px;min-width:0}.info small{display:block;color:#777;margin-bottom:5px}.info b{font-size:13px;overflow-wrap:anywhere}.schedule{display:grid;gap:8px}.due-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:11px;border:1px solid #e8e9e4;border-radius:11px}.due-row small{display:block;color:#777;margin-top:4px}.paid{font-size:11px;font-weight:800;color:#9a6900}.paid.yes{color:#17824a}.due-row .btn{padding:8px 10px;font-size:11px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions .btn{flex:1}.empty{padding:20px;text-align:center;color:#888;background:#fafaf8;border-radius:12px}.error{color:#a22;background:#fff0f0;padding:10px;border-radius:10px}.sms-overlay{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:15px;z-index:10}.sms-box{width:min(520px,100%)}@media(max-width:900px){.layout{grid-template-columns:1fr}.list{max-height:330px}.detail{min-height:300px}}@media(max-width:540px){.wrap{padding:10px}.top{align-items:flex-start;flex-wrap:wrap}.stats{grid-template-columns:1fr}.info-grid{grid-template-columns:1fr}.due-row{grid-template-columns:1fr auto}.due-row .btn{grid-column:1/-1}.detail-head{align-items:flex-start}.detail-photo{width:78px;height:78px}}
</style></head><body><main class="wrap">
<section id="gate" class="card"><h1>SHOPLY · Nasiya boshqaruvi</h1><p class="muted">Maxsus admin paroli bilan kiring.</p><label>Parol</label><input id="pass" type="password" autocomplete="current-password" placeholder="Nasiya admin paroli"><p id="err" class="muted"></p><button class="btn" id="enter">Kirish</button></section>
<section id="app" class="hidden"><header class="top"><div><h1>Nasiya boshqaruvi</h1><div class="muted">Arizalar, mijozlar va haftalik to‘lovlar</div></div><div class="actions" style="margin:0"><button class="btn secondary" id="refresh">Yangilash</button><button class="btn secondary" id="logout">Chiqish</button></div></header>
<div class="layout"><section class="card list-panel"><div class="list-head"><b>Arizalar ro‘yxati</b><span class="pill" id="count">0 ta</span></div><input id="search" placeholder="Ism, telefon yoki mahsulot bo‘yicha qidirish"><select id="filter"><option value="all">Barcha arizalar</option><option>Yangi ariza</option><option>Ko‘rib chiqilmoqda</option><option>Tasdiqlandi</option><option>To‘lovda</option><option>Yopildi</option><option>Rad etildi</option></select><div class="list" id="list"><div class="empty">Yuklanmoqda...</div></div></section>
<section class="card detail" id="detail"><div class="detail-empty">← Chap tomondan arizani tanlang<br> Mijozning to‘liq ma’lumotlari shu yerda ko‘rinadi.</div></section></div></section>
<div id="smsModal" class="sms-overlay hidden"><div class="card sms-box"><h2>SMS yuborish</h2><p class="muted" id="smsTarget"></p><label>Xabar matni</label><textarea id="smsText" rows="5" maxlength="500"></textarea><div class="actions"><button class="btn" id="smsSend">SMS yuborish</button><button class="btn secondary" id="smsCancel">Bekor qilish</button></div><p class="muted" id="smsStatus"></p></div></div>
</main><script>
const $=id=>document.getElementById(id);let rows=[],selectedId='',smsId='';
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||d.error||`Server xatosi (${r.status})`);return d}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(v){return (Number(v)||0).toLocaleString('uz-UZ')+' so‘m'}function date(v){return v?new Date(v).toLocaleString('uz-UZ'):'—'}function daysLeft(v){return Math.ceil((new Date(v).getTime()-Date.now())/86400000)}
async function enter(){try{await api('/api/admin/nasiya-login',{method:'POST',body:JSON.stringify({password:$('pass').value})});$('gate').classList.add('hidden');$('app').classList.remove('hidden');await load()}catch(e){$('err').textContent=e.message;$('pass').value=''}}
async function load(){try{const previous=selectedId;rows=await api('/api/admin/nasiya-requests');if(!Array.isArray(rows))throw Error('Server arizalar ro‘yxatini noto‘g‘ri formatda qaytardi');$('count').textContent=rows.length+' ta';renderList();if(rows.some(x=>x.id===previous))select(previous);else if(rows.length)select(rows[0].id);else $('detail').innerHTML='<div class="detail-empty">Hozircha nasiya arizalari yo‘q.<br>Yangi ariza yuborilgach, shu yerda paydo bo‘ladi.</div>'}catch(e){$('list').innerHTML=`<div class="error">Arizalarni yuklab bo‘lmadi: ${esc(e.message)}<br><small>Server va Supabase sozlamalarini tekshiring.</small></div>`;$('detail').innerHTML='<div class="detail-empty">Ma’lumotlar yuklanmadi</div>'}}
function renderList(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const filtered=rows.filter(x=>(f==='all'||x.status===f)&&[x.name,x.phone,x.productName,x.email].some(v=>String(v||'').toLowerCase().includes(q)));$('list').innerHTML=filtered.length?filtered.map(x=>`<div class="app-row ${selectedId===x.id?'active':''}" onclick="select('${esc(x.id)}')"><img class="avatar" src="${esc(x.selfieDataUrl||x.productImage||'https://placehold.co/100x100?text=SHOPLY')}" alt=""><div class="app-main"><b>${esc(x.name)}</b><small>${esc(x.productName)} · ${money(x.price)}</small><small>${esc(x.phone)} · ${date(x.createdAt)}</small></div><span class="pill">${esc(x.status)}</span></div>`).join(''):'<div class="empty">Mos ariza topilmadi</div>'}
function select(id){selectedId=id;renderList();const x=rows.find(v=>v.id===id);if(!x)return;const paid=(x.schedule||[]).filter(d=>d.paid).reduce((a,d)=>a+Number(d.amount||0),0),remaining=Math.max(0,Number(x.price||0)-paid),next=(x.schedule||[]).find(d=>!d.paid);$('detail').innerHTML=`<div class="detail-head">${x.productImage?`<img class="detail-photo" src="${esc(x.productImage)}" alt="Mahsulot rasmi">`:'<div class="detail-photo" style="display:grid;place-items:center">Rasm yo‘q</div>'}<div style="min-width:0;flex:1"><h2>${esc(x.productName)}</h2><b>${money(x.price)}</b><p class="muted">${esc(x.status)} · Ariza: ${date(x.createdAt)}</p></div></div>
<div class="stats"><div class="stat"><small>Jami qarz</small><b>${money(x.price)}</b></div><div class="stat"><small>To‘langan</small><b>${money(paid)}</b></div><div class="stat"><small>Qolgan</small><b>${money(remaining)}</b></div></div>
<div class="section"><h3>Mijoz ma’lumotlari</h3><div class="info-grid"><div class="info"><small>Ism-familiya</small><b>${esc(x.name)}</b></div><div class="info"><small>Telefon</small><b><a href="tel:${esc(x.phone)}">${esc(x.phone)}</a></b></div><div class="info"><small>Email</small><b>${esc(x.email)}</b></div><div class="info"><small>Manzil</small><b>${esc(x.address)}</b></div><div class="info"><small>Telegram</small><b>${esc(x.telegram?.firstName||'—')} ${x.telegram?.username?'(@'+esc(x.telegram.username)+')':''}</b></div><div class="info"><small>Telegram ID</small><b>${esc(x.telegram?.id||'—')} · Tasdiqlanmagan</b></div><div class="info"><small>Ariza kanali</small><b>${esc(x.channel||'—')}</b></div><div class="info"><small>Lokatsiya</small><b>${x.location?.lat!=null&&x.location?.lng!=null?`<a target="_blank" rel="noopener" href="https://maps.google.com/?q=${encodeURIComponent(x.location.lat+','+x.location.lng)}">Xaritada ko‘rish</a>`:'Berilmagan'}</b></div></div>${x.selfieDataUrl?`<p class="muted">Mijoz yuborgan profil rasmi:</p><img src="${x.selfieDataUrl}" style="width:120px;height:120px;object-fit:cover;border-radius:12px" alt="Mijoz rasmi">`:''}</div>
<div class="section"><h3>Xarid va hisob-kitob</h3><div class="info-grid"><div class="info"><small>Mahsulot nomi</small><b>${esc(x.productName)}</b></div><div class="info"><small>Mahsulot narxi</small><b>${money(x.originalPrice??(x.price-5000))}</b></div><div class="info"><small>Xizmat haqi</small><b>${money(x.serviceFee??5000)}</b></div><div class="info"><small>Umumiy summa</small><b>${money(x.price)}</b></div><div class="info"><small>Muddat</small><b>${Number(x.weeks)||'—'} hafta</b></div><div class="info"><small>Haftalik taxminiy to‘lov</small><b>${money(x.weeklyEstimate)}</b></div></div></div>
<div class="section"><h3>To‘lov jadvali ${next?`· Keyingi to‘lovga ${Math.max(0,daysLeft(next.dueAt))} kun qoldi`:''}</h3><div class="schedule">${(x.schedule||[]).length?(x.schedule||[]).map(d=>{const left=daysLeft(d.dueAt);return `<div class="due-row"><div><b>${d.number}-hafta · ${money(d.amount)}</b><small>${date(d.dueAt)} ${d.paid?'· To‘langan: '+date(d.paidAt):left<0?'· Muddati o‘tgan':left===0?'· Bugun to‘lash kerak':'· '+left+' kun qoldi'}</small></div><span class="paid ${d.paid?'yes':''}">${d.paid?'✓ To‘landi':'Kutilmoqda'}</span>${d.paid?'<span class="pill">Yopilgan</span>':`<button class="btn" onclick="markPaid('${esc(x.id)}',${d.number})">To‘landi</button>`}</div>`}).join(''):'<div class="empty">Ariza tasdiqlangach, to‘lov jadvali yaratiladi.</div>'}</div></div>
<div class="section"><h3>Boshqaruv</h3><div class="actions"><button class="btn" onclick="changeStatus('${esc(x.id)}','Tasdiqlandi')">Tasdiqlash va jadval yaratish</button><button class="btn secondary" onclick="changeStatus('${esc(x.id)}','Ko‘rib chiqilmoqda')">Ko‘rib chiqilmoqda</button><button class="btn danger" onclick="changeStatus('${esc(x.id)}','Rad etildi')">Rad etish</button><button class="btn secondary" onclick="sms('${esc(x.id)}')">SMS yozish</button></div></div>
<div class="section"><h3>To‘lovlar tarixi</h3>${(x.paymentHistory||[]).length?(x.paymentHistory||[]).map(p=>`<p class="muted">${p.number}-hafta · ${money(p.amount)} · ${date(p.paidAt)} · ${esc(p.method||'')}</p>`).join(''):'<p class="muted">Hozircha to‘lov qayd etilmagan.</p>'}</div>
<div class="section"><h3>SMS tarixi</h3>${(x.notifications||[]).filter(n=>n.type==='sms').length?x.notifications.filter(n=>n.type==='sms').map(n=>`<p class="muted">${date(n.at)} — ${esc(n.message)}</p>`).join(''):'<p class="muted">SMS yuborilmagan.</p>'}</div>`}
async function changeStatus(id,status){try{await api('/api/admin/nasiya-requests/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status})});await load()}catch(e){alert(e.message)}}async function markPaid(id,num){if(!confirm(`${num}-haftalik to‘lovni to‘landi deb belgilaysizmi?`))return;try{await api('/api/admin/nasiya-requests/'+encodeURIComponent(id)+'/pay/'+num,{method:'PATCH',body:JSON.stringify({paid:true})});await load()}catch(e){alert(e.message)}}
function sms(id){const x=rows.find(v=>v.id===id);smsId=id;$('smsTarget').textContent=`${x?.name||''} · ${x?.phone||''}`;$('smsText').value=`SHOPLY: Assalomu alaykum, ${x?.name||'mijoz'}. ${x?.productName||'Mahsulotingiz'} bo‘yicha to‘lov jadvalingiz haqida eslatma.`;$('smsStatus').textContent='';$('smsModal').classList.remove('hidden')}
async function sendSms(){try{$('smsSend').disabled=true;await api('/api/admin/nasiya-sms/'+encodeURIComponent(smsId),{method:'POST',body:JSON.stringify({message:$('smsText').value})});$('smsStatus').textContent='SMS provayderga yuborish so‘rovi qabul qilindi. Yetkazilishini Eskiz kabinetidan tekshiring.'}catch(e){$('smsStatus').textContent=e.message}finally{$('smsSend').disabled=false}}
$('enter').onclick=enter;$('pass').onkeydown=e=>{if(e.key==='Enter')enter()};$('refresh').onclick=load;$('search').oninput=renderList;$('filter').onchange=renderList;$('smsSend').onclick=sendSms;$('smsCancel').onclick=()=>$('smsModal').classList.add('hidden');$('logout').onclick=async()=>{await api('/api/admin/nasiya-logout',{method:'POST'});location.reload()};
</script></body></html>
