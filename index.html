<style>
  


:root{--accent:#b7f34a;--bg:#f5f6f2;--card:#fff;--ink:#191b16;--muted:#85877f;--line:#e5e6df}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;transition:.2s}
button:hover{filter:brightness(.96)}
.layout{display:flex;min-height:100vh}
.sidebar{width:250px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);padding:24px 15px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;min-height:550px}
.logo{font-size:28px;font-weight:950;letter-spacing:-1.5px;margin:3px 10px 30px}
.logo span{color:#84b92a}
.nav-title{font-size:10px;letter-spacing:1.5px;color:#a0a198;margin:16px 12px 10px}
.nav{width:100%;display:flex;align-items:center;gap:12px;border:0;background:transparent;color:#555;padding:13px 12px;border-radius:12px;text-align:left;margin:3px 0}
.nav .ico{width:25px;text-align:center;font-size:19px}
.nav:hover,.nav.active{background:var(--accent);color:#191b16}
.nav.active{font-weight:700}
.side-bottom{margin-top:auto;padding-top:20px}
.main{flex:1;min-width:0;padding:25px 30px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:23px}
.search{flex:1;position:relative}

.topbtn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.hero{min-height:250px;border-radius:23px;background:#20231b;color:#fff;padding:32px;position:relative;overflow:hidden;display:flex;align-items:center}
.hero:after{content:"✦";position:absolute;right:45px;top:-40px;font-size:240px;color:var(--accent);opacity:.95;transform:rotate(14deg)}
.hero-content{position:relative;z-index:1;max-width:70%}
.hero small{color:var(--accent);font-weight:800;letter-spacing:2px}
.hero h1{font-size:clamp(29px,4vw,45px);line-height:1.1;margin:15px 0 10px;max-width:600px}

<script>
(function(){
  const sharedKeys = new Set([
    'mono_store_products_v2','mono_store_settings_v2','mono_store_slides_v2',
    'mono_store_cart_events_v1','shoply_orders_v1','shoply_reviews_v1'
  ]);
  const nativeGet = Storage.prototype.getItem;
  const nativeSet = Storage.prototype.setItem;
  const nativeRemove = Storage.prototype.removeItem;
  const pending = new Set();
  const queues = new Map();
  const lastSent = new Map();

  function serverAvailable(){ return location.protocol === 'http:' || location.protocol === 'https:'; }
  async function push(key, value){
    if(!sharedKeys.has(String(key)) || !serverAvailable()) return false;
    key = String(key);
    const serialized = JSON.stringify(value);
    lastSent.set(key, serialized);
    const previous = queues.get(key) || Promise.resolve();
    const task = previous.catch(()=>{}).then(async()=>{
      if(lastSent.get(key) !== serialized) return true; // newer value will be sent by its queued task
      pending.add(key);
      try{
        const response = await fetch('/api/state/' + encodeURIComponent(key), {
          method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({value}), cache:'no-store'
        });
        if(!response.ok) throw new Error('HTTP ' + response.status);
        return true;
      }catch(error){ console.error('SHOPLY: JSON fayliga yozilmadi:', key, error); return false; }
      finally{ pending.delete(key); }
    });
    queues.set(key, task);
    return task;
  }
  window.shoplyPush = push;

  Storage.prototype.setItem = function(key, value){
    const k = String(key);
    let localError = null;
    try { nativeSet.call(this, key, value); } catch(error) { localError = error; }
    if(this === localStorage && sharedKeys.has(k)){
      try { void push(k, JSON.parse(String(value))); }
      catch(error) { console.error('SHOPLY: ma’lumotni tayyorlashda xato', error); }
      // Keep the app running if browser storage is full; the server remains the source of truth.
      if(localError) console.warn('SHOPLY: brauzer xotirasi to‘ldi; serverga saqlash davom etadi.');
      return;
    }
    if(localError) throw localError;
  };

  Storage.prototype.removeItem = function(key){
    nativeRemove.call(this, key);
    const k = String(key);
    if(this === localStorage && sharedKeys.has(k)){
      fetch('/api/state/' + encodeURIComponent(k), {method:'DELETE'}).catch(()=>{});
    }
  };

  window.shoplySyncReady = (async()=>{
    try{
      const response = await fetch('/api/state', {cache:'no-store'});
      if(!response.ok) throw new Error('HTTP ' + response.status);
      const state = await response.json();
      for(const [key,value] of Object.entries(state)){
        if(!sharedKeys.has(key)) continue;
        try { nativeSet.call(localStorage,key,JSON.stringify(value)); }
        catch(error) { console.warn('SHOPLY: katta ma’lumot localStorage ga sig‘madi:',key); }
      }
      window.shoplyServerConnected = true;
    }catch(error){
      window.shoplyServerConnected = false;
      console.error('SHOPLY serverga ulanmagan. Saytni server manzili orqali oching.', error);
    }
  })();

  setInterval(async()=>{
    try{
      const response = await fetch('/api/state', {cache:'no-store'});
      if(!response.ok) return;
      const state = await response.json();
      for(const [key,value] of Object.entries(state)){
        if(!sharedKeys.has(key) || pending.has(key)) continue;
        const next = JSON.stringify(value);
        if(nativeGet.call(localStorage,key) !== next){
          try { nativeSet.call(localStorage,key,next); }
          catch(error) { console.warn('SHOPLY: localStorage yangilanmadi:',key); }
          dispatchEvent(new StorageEvent('storage',{key,newValue:next,storageArea:localStorage}));
        }
      }
    }catch(error){}
  },3000);
})();
</script>

function read(key,fallback){
 try{const raw=localStorage.getItem(key);return raw===null?fallback:(JSON.parse(raw)??fallback)}
 catch(e){return fallback}
}
const categoryMap={women:'Ayollar',men:'Erkaklar',kids:'Bolalar',accessories:'Aksessuarlar',souvenirs:'Suvenirlar',sub:'Boshqa / maxsus'};
const reverseCategory={'Ayollar':'women','Erkaklar':'men','Bolalar':'kids','Aksessuarlar':'accessories','Suvenirlar':'souvenirs','Boshqa / maxsus':'sub'};
function canonicalCategory(p){
 const raw=p.category||p.cat||'';
 if(categoryMap[raw])return raw;
 if(reverseCategory[raw])return reverseCategory[raw];
 return 'sub';
}
function normalizeProduct(p){
 const key=canonicalCategory(p);
 return {...p,category:key,cat:categoryMap[key],sub:p.sub||'Tanlangan',price:Number(p.price)||0};
}

 <p class="muted">Telegram rasmi avtomatik ko‘rinishi uchun sayt Telegram Mini App ichida ochilgan bo‘lishi kerak. Aks holda rasm URL ni qo‘lda kiritish mumkin.</p>`);
}
$('settingsBtn').onclick=openSettings;
function saveUserProfile(){
 userProfile={...userProfile,name:$('profileName').value.trim(),username:$('profileUsername').value.trim().replace(/^@/,''),photo_url:$('profilePhoto').value.trim(),phone:$('profilePhone').value.trim(),email:$('profileEmail').value.trim()};
 localStorage.setItem(USER_PROFILE_KEY,JSON.stringify(userProfile));
 alert('Profil saqlandi.');
 openSettings();
}
function saveColor(){
 settings.accent=$('accentColor').value;
 localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));
 applyAccent();closeModal();
}
$('adminBtn').onclick=()=>openModal('🔐 Admin panelga kirish',`
 <p class="muted">Faqat administrator uchun.</p>
 <form id="adminLoginForm">
  <label>Login</label><input class="field" id="adminLogin" autocomplete="username" placeholder="Login" required>
  <label>Parol</label><input class="field" id="adminPassword" type="password" autocomplete="current-password" placeholder="Parol" required>
  <p id="loginError" style="color:#d33;font-size:13px"></p>
  <button class="primary" style="width:100%">Kirish →</button>
 </form>`);
document.addEventListener('submit',function(e){
 if(e.target.id!=='adminLoginForm')return;
 e.preventDefault();
 if($('adminLogin').value.trim()==='jamshid'&&$('adminPassword').value==='2400'){
  sessionStorage.setItem('mono_admin_session','1');
  location.href='admin.html';
 }else $('loginError').textContent='Login yoki parol noto‘g‘ri!';
});
function showSlide(){
 slides=read(SLIDE_KEY,slides);
 if(!Array.isArray(slides)||!slides.length){$('heroTitle').textContent='O‘zingga mos uslubni top.';$('heroText').textContent='Har kun uchun zamonaviy tanlovlar.';return}
 if(slideIndex>=slides.length)slideIndex=0;
 const s=slides[slideIndex];
 $('heroTitle').textContent=(s.emoji?s.emoji+' ':'')+(s.title||'SHOPLY');
 $('heroText').textContent=s.text||'Yangi mahsulotlarni kashf et.';
 slideIndex=(slideIndex+1)%slides.length;
}
applyAccent();saveCart();saveFavorites();showSlide();setInterval(showSlide,5000);
window.addEventListener('storage',e=>{
 if(e.key===PRODUCT_KEY){products=(read(PRODUCT_KEY,[])||[]).map(normalizeProduct);render()}
 if(e.key===REVIEWS_KEY){const opened=$('detailBg').classList.contains('open');if(opened){const title=$('detailContent').querySelector('.detail-title');const p=products.find(x=>x.name===title?.textContent);if(p)openProductDetails(p.id)}}
 if(e.key===SETTINGS_KEY){settings=read(SETTINGS_KEY,{accent:'#b7f34a'});applyAccent()}
 if(e.key===SLIDE_KEY){slides=read(SLIDE_KEY,[]);slideIndex=0;showSlide()}
 if(e.key===CART_KEY){cartItems=read(CART_KEY,{});saveCart()}
 if(e.key===FAVORITES_KEY){favorites=read(FAVORITES_KEY,[]);saveFavorites();renderProducts()}
 if(e.key===USER_PROFILE_KEY)userProfile=read(USER_PROFILE_KEY,userProfile);
});
render();
})();
</script>
